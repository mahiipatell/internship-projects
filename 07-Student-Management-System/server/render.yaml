# Render deploy config for the API server.
# Create a PostgreSQL instance on Render, attach it to this service, and set the
# env vars below (DATABASE_URL is auto-provided by the attached Postgres).
services:
  - type: web
    name: sms-server
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sms-db
          property: connectionString
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"

databases:
  - name: sms-db
    databaseName: sms
    plan: free
